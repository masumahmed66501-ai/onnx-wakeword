name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare wake word assets
        run: |
          mkdir -p android/app/src/main/assets
          cp models/en/heyjarvis_r1.onnx android/app/src/main/assets/
          cp models/en/model_info.json android/app/src/main/assets/
          cp models/melspectrogram.onnx android/app/src/main/assets/

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
